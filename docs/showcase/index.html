<!doctype html><html><head><meta charset="utf-8"><title>SystemPulse gallery renderer</title><style>
:root{--bg:#0b0e13;--surface:#12161e;--raised:#181d27;--border:#29303c;--text:#f2f5fa;--muted:#9ca6b8;--accent:#58d6c7;--blue:#6ea8fe;--purple:#b798ff;--warn:#ffb454}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px "Segoe UI Variable","Segoe UI",sans-serif}.app{width:1380px;height:900px;display:grid;grid-template-columns:218px 1fr;grid-template-rows:52px 1fr}.title{grid-column:1/3;background:var(--surface);border-bottom:1px solid var(--border);display:grid;grid-template-columns:218px 1fr auto;align-items:center}.brand{display:flex;align-items:center;padding-left:18px}.logo{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#071311;font-size:19px;font-weight:bold}.brand b{margin-left:10px;font-size:15px}.ver{margin-left:8px;color:var(--muted);font-size:12px}.caption{color:var(--muted);font-size:12px}.win{display:flex}.win span{width:46px;text-align:center;color:var(--muted);font-size:18px}.side{background:var(--surface);border-right:1px solid var(--border);padding:18px 14px 16px;display:flex;flex-direction:column}.section,.label{font-size:10px;font-weight:600;color:var(--muted)}.section{margin:0 12px 10px}.nav{height:46px;padding:0 12px;border-radius:7px;display:flex;align-items:center;margin-bottom:2px}.nav i{width:29px;color:var(--muted);font-style:normal;font-size:16px}.nav.on{background:#183034}.nav.on i{color:var(--accent)}.bottom{margin-top:auto}.health{border:1px solid #27504e;background:#112225;border-radius:8px;padding:13px;color:var(--accent);font-size:11px}.credit{text-align:center;color:var(--muted);font-size:11px;line-height:1.8;margin-top:10px}.main{padding:25px 30px 28px;overflow:hidden}.head{height:66px;display:flex;justify-content:space-between}.head h1{font-size:28px;font-weight:600;margin:0 0 5px}.head p,.sub{margin:0;color:var(--muted);font-size:11px}.head p{font-size:13px}.right{text-align:right;color:var(--muted);font-size:11px}.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px;box-shadow:0 4px 18px #0003}.gap{height:14px}.hardware{height:190px;display:grid;grid-template-columns:225px 150px 1fr 190px;gap:16px;align-items:center}.identity{display:flex;align-items:center}.badge{width:42px;height:42px;border-radius:9px;background:#173130;color:var(--accent);display:grid;place-items:center;font-size:10px;font-weight:bold;margin-right:13px}.name{font-size:14px;font-weight:600}.pill{display:inline-block;background:#17232a;border-radius:12px;padding:4px 9px;color:var(--accent);font-size:10px;margin-top:9px}.temp{font-size:43px;font-weight:600}.temp small{font-size:15px;color:var(--muted)}.spark{height:62px;background:linear-gradient(#285f5a77,transparent);clip-path:polygon(0 58%,8% 40%,16% 62%,24% 35%,32% 49%,40% 27%,48% 66%,56% 43%,64% 53%,72% 28%,80% 47%,88% 33%,100% 45%,100% 100%,0 100%);border-top:2px solid var(--accent)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:18px}.value{font-size:15px;margin-top:3px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.half{height:230px}.bar{height:4px;background:var(--raised);border-radius:3px;margin-top:10px}.bar i{display:block;width:62%;height:100%;background:var(--accent)}.row{display:flex;justify-content:space-between;align-items:center}.button{background:var(--raised);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:9px 13px;font-size:11px}.primary{background:var(--accent);color:#071311;border-color:var(--accent);font-weight:600}.warning{padding:14px;margin-bottom:14px;background:#211b14;border-color:#5a4528;color:var(--warn)}.table{padding:0;overflow:hidden}.tr{display:grid;grid-template-columns:2fr .7fr .8fr 1fr 1fr;align-items:center;height:52px;padding:0 18px;border-bottom:1px solid #202632}.th{height:43px;color:var(--muted);font-size:10px}.toolbar{display:flex;gap:10px;margin-bottom:14px}.search{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:11px;color:var(--muted)}.adapter{height:155px;display:grid;grid-template-columns:270px 1fr 230px;align-items:center;gap:24px}.drive{height:175px;display:grid;grid-template-columns:60px 1fr 280px;gap:18px}.sensorgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sensor{height:142px}.big{font-size:28px;color:var(--accent);margin-top:16px}.tune{height:565px}.backend{background:var(--raised);border-radius:7px;padding:12px;color:var(--muted);margin:16px 0}.slide{margin:17px 0}.actions{display:flex;gap:8px;margin-top:22px}.cleanup{height:590px;display:grid;grid-template-columns:1.05fr .95fr;gap:14px}.log{height:420px;background:var(--raised);border:1px solid var(--border);border-radius:6px;padding:12px;color:#a8b1c1;font:10px/1.6 Consolas;overflow:hidden}.file{background:var(--raised);border:1px solid var(--border);border-radius:7px;padding:14px;margin-top:12px}.history{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.chart{height:240px}.chartshape{height:135px;margin-top:20px;background:linear-gradient(#285f5a88,transparent);clip-path:polygon(0 70%,8% 45%,16% 61%,24% 28%,32% 45%,40% 20%,48% 59%,56% 32%,64% 50%,72% 18%,80% 41%,88% 27%,100% 38%,100% 100%,0 100%)}.settings{height:496px}.setting{padding:14px 0;border-bottom:1px solid var(--border)}.switch{width:34px;height:18px;border-radius:10px;background:var(--accent);position:relative}.switch:after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;background:white;border-radius:50%}
</style></head><body><div class="app"><header class="title"><div class="brand"><div class="logo">∿</div><b>SystemPulse</b><span class="ver">v08.1</span></div><div class="caption">Hardware monitor</div><div class="win"><span>⟳</span><span>−</span><span>□</span><span>×</span></div></header><aside class="side"><div class="section">MONITOR</div><div id="nav"></div><div class="bottom"><div class="health"><b>● LIVE MONITORING</b><br><br>System is nominal</div><div class="credit">Created by youmustbepro ♡<br><u>Changelog</u></div></div></aside><main class="main" id="main"></main></div><script>
const P=[['overview','⌂','Overview'],['performance','ϟ','Performance'],['overclock','↗','Overclock (BETA)'],['processes','▥','Processes'],['network','⌁','Network'],['storage','▭','Storage'],['sensors','⌁','Sensor details'],['cleanup','♲','Storage Cleanup'],['history','◷','History & alerts']],k=new URLSearchParams(location.search).get('page')||'overview';nav.innerHTML=P.map(x=>`<div class="nav ${x[0]==k?'on':''}"><i>${x[1]}</i>${x[2]}</div>`).join('');
const head=(a,b,c='Updated 19:24:56<br>Every 2 seconds')=>`<div class="head"><div><h1>${a}</h1><p>${b}</p></div><div class="right">${c}</div></div>`,facts=(a,b,c,d)=>`<div class="facts"><div><div class="label">${a[0]}</div><div class="value">${a[1]}</div></div><div><div class="label">${b[0]}</div><div class="value">${b[1]}</div></div><div><div class="label">${c[0]}</div><div class="value">${c[1]}</div></div><div><div class="label">${d[0]}</div><div class="value">${d[1]}</div></div></div>`,hw=(tag,n,s,t,f)=>`<div class="card hardware"><div class="identity"><div class="badge">${tag}</div><div><div class="name">${n}</div><div class="sub">${s}</div><span class="pill">● Normal</span></div></div><div><div class="temp">${t}<small>° C</small></div><div class="sub">Package temperature</div></div><div class="spark"></div>${f}</div>`;
const overview=()=>head('System overview','A live view of temperatures and component activity.','Updated 19:24:56<br><button class="button">Free RAM</button>')+hw('CPU','AMD Ryzen 9 9950X3D','16-Core Processor','54',facts(['Voltage','1.27 V'],['Power','142 W'],['Load','18%'],['Source','PawnIO']))+'<div class="gap"></div>'+hw('GPU','NVIDIA GeForce RTX 5090','Core temperature','61',facts(['Voltage','0.975 V'],['Board power','412 W'],['Load','37%'],['Source','NVIDIA driver']))+'<div class="gap"></div><div class="grid2"><div class="card half"><div class="identity"><div class="badge">SSD</div><div><div class="name">STORAGE</div><div class="sub">Samsung SSD 9100 PRO 4TB</div></div></div><div class="temp" style="margin-top:20px">38<small>° C</small></div><div class="bar"><i style="background:var(--purple)"></i></div><div class="sub" style="margin-top:14px">NVMe · PCIe 5.0 · 3.64 TB · Healthy</div></div><div class="card half"><div class="identity"><div class="badge">MB</div><div><div class="name">MOTHERBOARD</div><div class="sub">ASUS ROG CROSSHAIR X870E HERO</div></div></div><div class="temp" style="margin-top:20px">35<small>° C</small></div><div class="bar"><i></i></div><div class="sub" style="margin-top:14px">LibreHardwareMonitor · EC temperature</div></div></div>';
const performance=()=>head('Performance','Live component activity, frame pacing, and per-drive throughput.')+hw('CPU','PROCESSOR LOAD','AMD Ryzen 9 9950X3D','21',facts(['Load','21%'],['Power','142 W'],['Clock','5.7 GHz'],['Memory','41%']))+'<div class="gap"></div>'+hw('GPU','GRAPHICS ACTIVITY','NVIDIA GeForce RTX 5090','61',facts(['GPU load','74%'],['Frame rate','238 FPS'],['Frame time','4.2 ms'],['Application','Cyberpunk 2077']))+'<div class="gap"></div>'+hw('SSD','STORAGE ACTIVITY','Samsung SSD 9100 PRO 4TB','38',facts(['Active time','12%'],['Read','2.4 GB/s'],['Write','684 MB/s'],['Queue','0.4']));
const slides=g=>['Core clock','Memory clock','Core voltage','Power limit'].map((x,i)=>`<div class="slide"><div class="row"><b>${x}</b><span class="sub">${g?['3120 MHz','1750 MHz','1080 mV','575 W'][i]:['5700 MHz','Firmware controlled','Firmware controlled','181 W'][i]}</span></div><div class="bar"><i style="width:${[68,48,53,72][i]}%"></i></div></div>`).join(''),overclock=()=>head('Overclock <span style="color:var(--warn);font-size:11px">BETA</span>','Capability-checked CPU and GPU performance tuning with vendor-backed controls.','Tuning support detected')+'<div class="card warning"><b>! Performance tuning can cause instability, extra heat, or component damage</b></div><div class="grid2"><div class="card tune"><div class="identity"><div class="badge">CPU</div><div><b>PROCESSOR PROFILE</b><div class="sub">Intel(R) Core(TM) i9-14900KS</div></div></div><div class="backend">PawnIO direct Intel tuning · package power writable</div>'+slides(false)+'<div class="actions"><button class="button primary">Apply supported controls</button><button class="button">Restore baseline</button></div></div><div class="card tune"><div class="identity"><div class="badge">GPU</div><div><b>GRAPHICS PROFILE</b><div class="sub">NVIDIA GeForce RTX 5090</div></div></div><div class="backend">NVIDIA driver control · values applied through nvidia-smi</div>'+slides(true)+'<div class="actions"><button class="button primary">Apply supported controls</button><button class="button">Restore defaults</button></div></div></div>';
const rows=[['Cyberpunk 2077','18420','38.7%','12.4 GB','486 MB/s'],['Blender','22084','21.3%','8.8 GB','142 MB/s'],['SystemPulse','30116','2.1%','186 MB','4.2 MB/s'],['NVIDIA Container','4472','1.4%','218 MB','1.1 MB/s'],['Discord','11280','0.8%','684 MB','624 KB/s'],['Steam Client WebHelper','13544','0.4%','392 MB','184 KB/s'],['Windows Explorer','5296','0.2%','244 MB','48 KB/s'],['Desktop Window Manager','1940','0.1%','312 MB','0 B/s'],['System','4','0.1%','12 MB','2.8 MB/s'],['SearchHost','8240','0.0%','148 MB','0 B/s']],processes=()=>head('Processes','Live CPU, memory, and disk activity by application.','186 processes')+'<div class="toolbar"><div class="search">⌕ Filter processes</div><button class="button">Refresh now</button></div><div class="card table"><div class="tr th"><b>PROCESS NAME ↕</b><b>PID ↕</b><b>CPU ↕</b><b>MEMORY ↕</b><b>DISK ↕</b></div>'+rows.map(r=>`<div class="tr"><b>${r[0]}</b><span>${r[1]}</span><span>${r[2]}</span><span>${r[3]}</span><span>${r[4]}</span></div>`).join('')+'</div>';
const network=()=>head('Network','Live throughput and connection details for every adapter.')+[['10G Ethernet','Marvell AQtion 10Gbit Network Adapter','4.8 Gbps','1.2 Gbps'],['Wi-Fi 7','Qualcomm FastConnect 7800','812 Mbps','164 Mbps'],['Bluetooth Network','Personal Area Network','0 Kbps','0 Kbps']].map((r,i)=>`<div class="card adapter" style="margin-bottom:14px"><div class="identity"><div class="badge">NET</div><div><div class="name">${r[0]}</div><div class="sub">${r[1]}</div><div class="sub">192.168.1.${40+i}</div></div></div><div class="spark"></div>${facts(['Download',r[2]],['Upload',r[3]],['Link speed',i?'5.8 Gbps':'10 Gbps'],['Status','Connected'])}</div>`).join('');
const storage=()=>head('Storage','Health, identity, capacity, and live activity for every physical drive.')+[['Samsung SSD 9100 PRO 4TB','NVMe · PCIe 5.0 x4','3.64 TB','38 °C'],['WD_BLACK SN850X 4TB','NVMe · PCIe 4.0 x4','3.64 TB','42 °C'],['Seagate Exos X24 24TB','HDD · SATA 6 Gb/s','21.8 TB','34 °C']].map(r=>`<div class="card drive" style="margin-bottom:14px"><div class="badge">SSD</div><div><div class="name">${r[0]}</div><div class="sub">${r[1]}</div><div class="bar" style="margin-top:24px"><i style="background:var(--purple);width:88%"></i></div><div class="sub" style="margin-top:10px">${r[2]} capacity · Healthy</div></div>${facts(['Temperature',r[3]],['Health','Healthy'],['Read','2.4 GB/s'],['Write','684 MB/s'])}</div>`).join('');
const sensors=()=>head('Sensor details','Raw readings and their detected hardware sources.')+'<div class="sensorgrid">'+[['CPU package','54 °C','PawnIO · package sensor'],['CPU voltage','1.27 V','PawnIO · IA32_PERF_STATUS'],['CPU package power','142 W','PawnIO · energy counter'],['GPU core','61 °C','NVIDIA display driver'],['GPU voltage','0.975 V','NVAPI voltage telemetry'],['GPU board power','412 W','NVIDIA whole-board power'],['Motherboard','35 °C','LibreHardwareMonitor · EC'],['Storage','38 °C','NVMe SMART health log'],['Physical memory','41%','Windows native metrics'],['Frame time','4.2 ms','PresentMon ETW capture'],['Network receive','4.8 Gbps','Windows adapter counters'],['CPU fan','1,640 RPM','Super I/O controller']].map(r=>`<div class="card sensor"><b>${r[0]}</b><div class="big">${r[1]}</div><div class="label" style="margin-top:12px">SOURCE</div><div class="sub">${r[2]}</div></div>`).join('')+'</div>';
const cleanup=()=>head('Storage Cleanup <span style="color:var(--warn);font-size:11px">BETA</span>','Find temporary files and review large files that have been inactive for six months or longer.','Scan complete for D: · FAST STORAGE')+'<div class="card warning"><b>Folder-based cleanup safety</b> · Keep or Delete applies to every detected file in the parent folder.</div><div class="cleanup"><div class="card"><div class="label">SCAN OUTPUT</div><h3>18.6 GB eligible temporary files found</h3><div class="log">19:24:03  Started a read-only scan of D:<br>19:24:04  Checking temporary files and caches<br>19:24:06  Found 2.4 GB in Windows temporary storage<br>19:24:08  Found 8.7 GB in application caches<br>19:24:10  Reviewing large files inactive for six months<br>19:24:13  Review required: D:\Games\Archive\Benchmark.exe<br>19:24:17  Review required: D:\Video\Exports\Demo-Reel.mov<br>19:24:20  Scan complete · 2 folders require review</div><button class="button" style="margin-top:14px">Delete eligible temporary files</button></div><div class="card"><div class="label">FILE REVIEW</div><div class="sub">Non-temporary files are never deleted automatically.</div>'+[['D:\Games\Archive\Benchmark.exe','9.8 GB · Last activity 2025-08-14'],['D:\Video\Exports\Demo-Reel.mov','6.2 GB · Last activity 2025-06-02']].map(r=>`<div class="file"><b>${r[0]}</b><div class="sub">${r[1]}</div><div class="actions"><button class="button">Open folder</button><button class="button">Keep folder</button><button class="button primary">Delete folder</button></div></div>`).join('')+'</div></div>';
const history=()=>head('History & alerts','Review recent telemetry, export reports, and configure notifications.')+'<div class="history"><div><div class="card chart"><div class="row"><div><b>CPU temperature history</b><div class="sub">Last 30 minutes</div></div><div class="temp" style="font-size:27px">54<small>° C</small></div></div><div class="chartshape"></div></div><div class="card chart" style="margin-top:16px"><div class="row"><div><b>GPU temperature history</b><div class="sub">Last 30 minutes</div></div><div class="temp" style="font-size:27px;color:var(--blue)">61<small>° C</small></div></div><div class="chartshape"></div></div></div><div class="card settings"><h3 style="margin-top:0">Alert settings</h3>'+[['CPU temperature warning','85 °C'],['GPU temperature warning','85 °C'],['Storage temperature warning','65 °C'],['Storage health warning','Enabled'],['Notification-area alerts','Enabled']].map(r=>`<div class="setting row"><div><b>${r[0]}</b><div class="sub">${r[1]}</div></div><div class="switch"></div></div>`).join('')+'<div class="actions"><button class="button primary">Save settings</button><button class="button">Export CSV</button></div></div></div>';
main.innerHTML=({overview,performance,overclock,processes,network,storage,sensors,cleanup,history})[k]();
</script></body></html>
